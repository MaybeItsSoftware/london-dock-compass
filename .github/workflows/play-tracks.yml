# Diagnostic only -- reads Play, writes nothing. Exists because Play's track ids
# are not the names the Console displays and differ per form factor, so the only
# reliable way to address a track is to ask which ones exist.
name: List Play tracks

on:
  workflow_dispatch:

jobs:
  list-tracks:
    name: Ask Play which tracks exist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby + Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: List tracks
        run: bundle exec fastlane android list_tracks
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
