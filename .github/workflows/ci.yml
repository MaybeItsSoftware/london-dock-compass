name: Android CI

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Lint, test & release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Lint
        run: ./gradlew lint
      - name: Unit tests
        run: ./gradlew test
      # The shipped build is the minified one. Without this, an R8 or resource-shrinking
      # regression — the kind kotlinx.serialization's generated serializers invite — stays
      # invisible until the Fastlane deploy step, which is a bad place to find out.
      # The signing config no-ops when keystore.properties is absent, so this needs no secrets.
      - name: Release build
        run: ./gradlew assembleRelease
