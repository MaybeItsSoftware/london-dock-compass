name: Re-seed dock locations

on:
  push:
    branches: [ main ]
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: reseed-dock-locations
  cancel-in-progress: false

jobs:
  reseed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # PRs opened with the built-in GITHUB_TOKEN do not trigger other workflows, so Android CI
      # never ran on them — it showed a red zero-job run instead. A GitHub App token is treated
      # as a real author, so CI runs on the refresh PR like any other. Until the App is set up
      # (vars.RESEED_APP_ID + secrets.RESEED_APP_PRIVATE_KEY) this falls back to GITHUB_TOKEN,
      # so the weekly refresh keeps working either way.
      - name: Mint GitHub App token
        id: app-token
        if: ${{ vars.RESEED_APP_ID != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RESEED_APP_ID }}
          private-key: ${{ secrets.RESEED_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Re-seed docklocations.json from TfL
        env:
          TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}
        run: python3 scripts/seed_dock_locations.py

      # The action creates/updates a PR only when the generated file differs,
      # and closes an existing refresh PR if its changes are no longer needed.
      - name: Open or update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          commit-message: "chore: re-seed dock locations from TfL"
          title: "chore: re-seed dock locations from TfL"
          body: |
            Automated refresh of `docklocations.json` from the live TfL BikePoint API.

            Generated by `.github/workflows/reseed-dock-locations.yml` via `scripts/seed_dock_locations.py`.
          branch: reseed-dock-locations
          base: main
          delete-branch: true
          add-paths: core/src/main/res/raw/docklocations.json
