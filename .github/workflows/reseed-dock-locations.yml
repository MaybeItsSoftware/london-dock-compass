name: Re-seed dock locations

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  reseed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Re-seed docklocations.json from TfL
        env:
          TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}
        run: python3 scripts/seed_dock_locations.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- app/src/main/res/raw/docklocations.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: re-seed dock locations from TfL"
          title: "chore: re-seed dock locations from TfL"
          body: |
            Automated refresh of `docklocations.json` from the live TfL BikePoint API.

            Generated by `.github/workflows/reseed-dock-locations.yml` via `scripts/seed_dock_locations.py`.
          branch: reseed-dock-locations
          delete-branch: true
          add-paths: app/src/main/res/raw/docklocations.json
