name: Promote a release

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Release to promote, e.g. v1.3.0. Selects the artefact by version code, not
          the code that runs — this workflow always uses main's Fastfile, so a fix to
          the pipeline applies to promoting older releases too. Leave blank to promote
          whatever currently sits on the internal tracks.
        required: false
      track:
        description: >-
          Target stage. Not a raw Play track id — the two form factors do not share
          them (wear:Alpha vs alpha), so fastlane/Fastfile maps stage + form to the
          real id. Run the "List Play tracks" workflow to see what Play actually has.
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - closed
          - open
      form:
        description: 'Which bundle(s) to promote'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - wear
          - mobile
      status:
        description: >-
          Release status. A track that has never had a live rollout only accepts "draft",
          which must then be finished by hand in Play Console — a release left in Draft is
          invisible to testers however healthy the bundle is.
        required: false
        default: 'completed'
        type: choice
        options:
          - completed
          - draft

jobs:
  promote-android:
    name: Android → Play ${{ inputs.track }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Deliberately not `ref: inputs.version`. Checking out the tag pins the
      # *pipeline* to whatever it looked like at release time, so a Fastfile bug
      # fixed since then comes straight back -- which is exactly what happened
      # promoting v1.3.0 against the tag that predated the changelog fix.
      - uses: actions/checkout@v4
      - name: Set up Ruby + Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      # Inputs go through env rather than straight into the run block: they are
      # attacker-shaped strings as far as the shell is concerned, and version is
      # optional, so it has to be appended conditionally rather than passed empty
      # (fastlane would read "version:" as the empty string, which is truthy).
      - name: Promote internal → ${{ inputs.track }}
        run: |
          args=("track:$TRACK" "form:$FORM" "status:$STATUS")
          if [ -n "$VERSION" ]; then
            args+=("version:$VERSION")
          else
            echo "::warning::no version given -- promoting whatever currently sits on the internal tracks"
          fi
          bundle exec fastlane android promote "${args[@]}"
        env:
          TRACK: ${{ inputs.track }}
          FORM: ${{ inputs.form }}
          STATUS: ${{ inputs.status }}
          VERSION: ${{ inputs.version }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
